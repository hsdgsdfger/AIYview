name: release

# 推 tag（例如 v3.0）时在 GitHub 的 Windows runner 上出安装版与绿色版，自动挂到 Release。
# 本机 electron-builder 打包会挂在 packaging 阶段，所以本地只用重打 asar 的方式出包；
# 正式安装包交给 CI（runner 上不会卡）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install
        run: npm ci
        env:
          npm_config_registry: https://registry.npmjs.org

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build installer (NSIS)
        run: npx electron-builder --win nsis --publish never

      - name: Trim unpacked bundle
        shell: pwsh
        run: |
          $dist = Get-ChildItem -LiteralPath release/pkg2 -Directory -Filter "win-unpacked" | Select-Object -First 1
          if (-not $dist) { throw "找不到 win-unpacked" }
          $nm = Join-Path $dist.FullName "resources/app.asar.unpacked/node_modules"

          # 1) onnxruntime 只留 win32/x64（darwin/linux/arm64 共约 228MB）
          foreach ($p in @("onnxruntime-node/bin/napi-v6/darwin","onnxruntime-node/bin/napi-v6/linux","onnxruntime-node/bin/napi-v6/win32/arm64")) {
            $full = Join-Path $nm $p
            if (Test-Path -LiteralPath $full) { Remove-Item -LiteralPath $full -Recurse -Force }
          }

          # 2) better-sqlite3 编译中间件（约 33MB，保留 .node）
          $rel = Join-Path $nm "better-sqlite3/build/Release"
          if (Test-Path -LiteralPath (Join-Path $rel "obj")) { Remove-Item -LiteralPath (Join-Path $rel "obj") -Recurse -Force }
          if (Test-Path -LiteralPath $rel) {
            Get-ChildItem -LiteralPath $rel -File | Where-Object {
              $_.Name -match '\.(iobj|ipdb|lib|exp)$' -or $_.Name -match '^test_extension\.'
            } | Remove-Item -Force
          }

          # 3) 语言包只留中英（约 43MB）
          Get-ChildItem -LiteralPath (Join-Path $dist.FullName "locales") -File |
            Where-Object { $_.Name -notin @('en-US.pak','zh-CN.pak','zh-TW.pak') } |
            Remove-Item -Force

          # 自检：关键二进制还在
          foreach ($m in @("onnxruntime-node/bin/napi-v6/win32/x64","better-sqlite3/build/Release/better_sqlite3.node","@img/colour/package.json")) {
            if (-not (Test-Path -LiteralPath (Join-Path $nm $m))) { throw "裁剪后缺失：$m" }
          }
          "size: {0:N1} MB" -f ((Get-ChildItem -LiteralPath $dist.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Zip portable bundle
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dist = (Get-ChildItem -LiteralPath release/pkg2 -Directory -Filter "win-unpacked" | Select-Object -First 1).FullName
          $out = Join-Path "release/pkg2" "AIYview-$ver-portable-win-x64.zip"
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Force }
          Compress-Archive -Path (Join-Path $dist "*") -DestinationPath $out -CompressionLevel Optimal
          Get-Item -LiteralPath $out | ForEach-Object { "zip: {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiyview-win
          path: |
            release/pkg2/*.exe
            release/pkg2/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/pkg2/*.exe
            release/pkg2/*.zip
          generate_release_notes: true
