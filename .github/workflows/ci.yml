name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install
        run: npm ci
        env:
          npm_config_registry: https://registry.npmjs.org

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Migration smoke (fresh DB file)
        run: node scripts/db-migrate.mjs --db ./tmp/ci.sqlite

      - name: Migration status (must be empty pending)
        run: node scripts/db-migrate.mjs --db ./tmp/ci.sqlite --status

      - name: Build renderer
        run: npm run build:renderer

      - name: Package (dir only, no installer)
        run: npm run build

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yiziview-next-unpacked
          path: release/win-unpacked
          if-no-files-found: warn
